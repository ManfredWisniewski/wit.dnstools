---
- name: Ensure Python dependencies for DNS tasks are installed
  include_tasks: requirements.yml

- name: Check if host is Debian-based (via /etc/debian_version)
  stat:
    path: /etc/debian_version
  register: dnstools_debian_release
  delegate_to: localhost

- name: Detect resolvectl
  command: bash -lc "command -v resolvectl"
  register: resolvectl_path
  changed_when: false
  failed_when: false
  delegate_to: localhost

- name: Detect systemd-resolve
  command: bash -lc "command -v systemd-resolve"
  register: systemd_resolve_path
  changed_when: false
  failed_when: false
  delegate_to: localhost

- name: Flush DNS via resolvectl
  command: resolvectl flush-caches
  become: true
  when: resolvectl_path.rc == 0
  ignore_errors: true
  delegate_to: localhost

- name: Flush DNS via systemd-resolve
  command: systemd-resolve --flush-caches
  become: true
  when: resolvectl_path.rc != 0 and systemd_resolve_path.rc == 0
  ignore_errors: true
  delegate_to: localhost

- name: check DNS Server
  command: dig @8.8.8.8 +short NS {{ dns_domain }}
  register: dns_servers
  changed_when: false
  when: dns_domain is defined
  delegate_to: localhost

- name: Display nameservers
  debug:
    var: dns_servers.stdout_lines
  when:
    - dns_servers is defined
    - wit_devmode | default(false)
  delegate_to: localhost

- name: Check if using Netcup nameservers
  set_fact:
    is_netcup_dns: "{{ dns_servers.stdout is search('netcup.net') }}"
  when: dns_servers is defined
  delegate_to: localhost

- name: Include Netcup DNS tasks
  include_tasks: netcup.yml
  when: is_netcup_dns | bool

- name: Build list of changed DNS records
  set_fact:
    dnstools_changed_records: "{{ (dnstools_changed_records | default([])) + [ item ] }}"
  loop: "{{ dns_records_to_update | default([]) }}"
  when:
    - is_netcup_dns | bool
    - dns_records_to_update is defined
    - netcup_existing_records is defined
    - (
        (netcup_existing_records
          | selectattr('hostname','equalto', (item.hostname | default('')))
          | selectattr('type','equalto', (item.type | upper))
          | selectattr('destination','equalto', (item.destination | default('')))
          | list | length)
      ) == 0
  delegate_to: localhost

- name: Build formatted change lines
  set_fact:
    dnstools_change_lines: "{{ (dnstools_change_lines | default([])) + [ '%-5s %-25s %-18s %s' | format(item.type | upper, item.hostname, item.destination, (item.ttl | default(300))) ] }}"
  loop: "{{ dnstools_changed_records | default([]) }}"
  when:
    - is_netcup_dns | bool
    - dnstools_changed_records is defined
    - (dnstools_changed_records | length) > 0
  delegate_to: localhost

# Collect and print deletions
- name: Build list of DNS records marked for deletion
  set_fact:
    dnstools_deleted_records: "{{ (dnstools_deleted_records | default([])) + [ item ] }}"
  loop: "{{ dns_records_to_update | default([]) }}"
  when:
    - wit_devmode | default(false)
    - is_netcup_dns | bool
    - dns_records_to_update is defined
    - (item.deleterecord | default('false')) | string | lower == 'true'
  delegate_to: localhost

- name: Build formatted deletion lines
  set_fact:
    dnstools_delete_lines: "{{ (dnstools_delete_lines | default([])) + [ '%-5s %-25s %-18s %s' | format(item.type | upper, item.hostname, item.destination, (item.ttl | default(300))) ] }}"
  loop: "{{ dnstools_deleted_records | default([]) }}"
  when:
    - wit_devmode | default(false)
    - is_netcup_dns | bool
    - dnstools_deleted_records is defined
    - (dnstools_deleted_records | length) > 0
  delegate_to: localhost

- name: Summary of DNS deletions
  debug:
    msg: "{{ item }}"
  loop: "{{ dnstools_delete_lines | default([]) }}"
  when:
    - is_netcup_dns | bool
    - dnstools_delete_lines is defined
    - (dnstools_delete_lines | length) > 0
  loop_control:
    label: ""
  delegate_to: localhost

- name: Summary of DNS changes (created/updated)
  debug:
    msg: "{{ item }}"
  loop: "{{ dnstools_change_lines | default([]) }}"
  when:
    - is_netcup_dns | bool
    - dnstools_change_lines is defined
    - (dnstools_change_lines | length) > 0
  loop_control:
    label: ""
  delegate_to: localhost

- name: Display warning if no supported DNS provider found
  debug:
    msg: "No supported DNS provider found. Current nameservers: {{ dns_servers.stdout_lines | join(', ') }} Please update DNS manually."
  when:
    - not is_netcup_dns
    - dns_servers is defined
  delegate_to: localhost


