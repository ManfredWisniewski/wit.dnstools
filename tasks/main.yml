---
- name: Ensure Python dependencies for DNS tasks are installed
  include_tasks: requirements.yml

- name: Early Netcup credential check
  uri:
    url: "{{ netcup_endpoint }}"
    method: POST
    body_format: json
    headers:
      Content-Type: "application/json"
    body:
      action: "login"
      clientrequestid: "{{ inventory_hostname }}-early-login-{{ ansible_date_time.epoch | default('0') }}"
      param:
        customernumber: "{{ (netcup_customer_number | string) | trim }}"
        apikey: "{{ netcup_api_key | trim }}"
        apipassword: "{{ netcup_api_password | trim }}"
    return_content: yes
  register: netcup_early_login
  failed_when: "netcup_early_login.json is not defined or (netcup_early_login.json.status | default('error')) != 'success'"
  when:
    - (netcup_customer_number | default('')) | length > 0
    - (netcup_api_key | default('')) | length > 0
    - (netcup_api_password | default('')) | length > 0
  delegate_to: localhost

- name: Check if host is Debian-based (via /etc/debian_version)
  stat:
    path: /etc/debian_version
  register: dnstools_debian_release
  delegate_to: localhost

- name: Detect resolvectl
  command: bash -lc "command -v resolvectl"
  register: resolvectl_path
  changed_when: false
  failed_when: false
  delegate_to: localhost

- name: Detect systemd-resolve
  command: bash -lc "command -v systemd-resolve"
  register: systemd_resolve_path
  changed_when: false
  failed_when: false
  delegate_to: localhost

- name: Flush DNS via resolvectl
  command: resolvectl flush-caches
  become: true
  when: resolvectl_path.rc == 0
  ignore_errors: true
  delegate_to: localhost

- name: Flush DNS via systemd-resolve
  command: systemd-resolve --flush-caches
  become: true
  when: resolvectl_path.rc != 0 and systemd_resolve_path.rc == 0
  ignore_errors: true
  delegate_to: localhost

- name: Normalize dns_domain into a list
  set_fact:
    dns_domain_list: >-
      {{ (dns_domain if dns_domain is iterable and dns_domain is not string else [dns_domain])
         if (dns_domain is defined and (dns_domain | length) > 0)
         else [] }}
  delegate_to: localhost

- name: Check DNS servers for each domain
  command: dig @8.8.8.8 +short NS {{ item }}
  register: _dns_servers_checks
  changed_when: false
  delegate_to: localhost
  loop: "{{ dns_domain_list }}"

- name: Display nameservers per domain (dev mode)
  debug:
    var: domain_check.stdout_lines
  when: wit_devmode | default(false)
  loop: "{{ _dns_servers_checks.results | default([]) }}"
  loop_control:
    loop_var: domain_check
    label: "{{ domain_check.item }}"
  delegate_to: localhost

- name: Include Netcup DNS tasks for domains using Netcup
  include_tasks: netcup.yml
  vars:
    dns_domain: "{{ domain_check.item }}"
  when: (domain_check.stdout | default('')) is search('netcup.net')
  loop: "{{ _dns_servers_checks.results | default([]) }}"
  loop_control:
    loop_var: domain_check

- name: Build list of changed DNS records
  set_fact:
    dnstools_changed_records: "{{ (dnstools_changed_records | default([])) + [ rec ] }}"
  loop: "{{ dns_records_to_update | default([]) }}"
  loop_control:
    loop_var: rec
  when:
    - (is_netcup_dns | default(false)) | bool
    - dns_records_to_update is defined
    - netcup_existing_records is defined
    - (
        (netcup_existing_records
          | selectattr('hostname','equalto', (rec.hostname | default('')))
          | selectattr('type','equalto', (rec.type | upper))
          | selectattr('destination','equalto', (rec.destination | default('')))
          | list | length)
      ) == 0
  delegate_to: localhost

- name: Build formatted change lines
  set_fact:
    dnstools_change_lines: "{{ (dnstools_change_lines | default([])) + [ '%-5s %-25s %-18s %s' | format(ch.type | upper, ch.hostname, ch.destination, (ch.ttl | default(300))) ] }}"
  loop: "{{ dnstools_changed_records | default([]) }}"
  loop_control:
    loop_var: ch
  when:
    - (is_netcup_dns | default(false)) | bool
    - dnstools_changed_records is defined
    - (dnstools_changed_records | length) > 0
  delegate_to: localhost

# Collect and print deletions
- name: Build list of DNS records marked for deletion
  set_fact:
    dnstools_deleted_records: "{{ (dnstools_deleted_records | default([])) + [ recdel ] }}"
  loop: "{{ dns_records_to_update | default([]) }}"
  loop_control:
    loop_var: recdel
  when:
    - wit_devmode | default(false)
    - (is_netcup_dns | default(false)) | bool
    - dns_records_to_update is defined
    - (recdel.deleterecord | default('false')) | string | lower == 'true'
  delegate_to: localhost

- name: Build formatted deletion lines
  set_fact:
    dnstools_delete_lines: "{{ (dnstools_delete_lines | default([])) + [ '%-5s %-25s %-18s %s' | format(dl.type | upper, dl.hostname, dl.destination, (dl.ttl | default(300))) ] }}"
  loop: "{{ dnstools_deleted_records | default([]) }}"
  loop_control:
    loop_var: dl
  when:
    - wit_devmode | default(false)
    - (is_netcup_dns | default(false)) | bool
    - dnstools_deleted_records is defined
    - (dnstools_deleted_records | length) > 0
  delegate_to: localhost

- name: Summary of DNS deletions
  debug:
    msg: "{{ line }}"
  loop: "{{ dnstools_delete_lines | default([]) }}"
  loop_control:
    loop_var: line
  when:
    - (is_netcup_dns | default(false)) | bool
    - dnstools_delete_lines is defined
    - (dnstools_delete_lines | length) > 0
  loop_control:
    label: ""
  delegate_to: localhost

- name: Summary of DNS changes (created/updated)
  debug:
    msg: "{{ line }}"
  loop: "{{ dnstools_change_lines | default([]) }}"
  loop_control:
    loop_var: line
  when:
    - (is_netcup_dns | default(false)) | bool
    - dnstools_change_lines is defined
    - (dnstools_change_lines | length) > 0
  loop_control:
    label: ""
  delegate_to: localhost

- name: Display warning if no supported DNS provider found
  debug:
    msg: "No supported DNS provider found. Current nameservers: {{ dns_servers.stdout_lines | join(', ') }} Please update DNS manually."
  when:
    - (is_netcup_dns | default(false)) | bool == false
    - dns_servers is defined
  delegate_to: localhost


